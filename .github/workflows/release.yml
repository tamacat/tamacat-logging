# Release: publish tamacat-logging to the mvn-repo branch of
# tamacat/tamacat.github.io and to GitHub Releases, on a v* tag pushed on main.
#
# Gates (publish nothing unless all pass): tag/version/reachability checks and
# `mvn clean verify` on Linux with >= 1 test and 0 failures, errors and skips.
# The publish jobs reuse the exact files built and tested by verify.
#
# Setup (once): environment "release" with required reviewers, and the
# environment secret MVN_REPO_PAT (fine-grained PAT: tamacat/tamacat.github.io,
# Contents read/write).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-sha256: ${{ steps.dist.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag, the pom version and reachability from main
        id: version
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; n={'m':'http://maven.apache.org/POM/4.0.0'}; print(E.parse('pom.xml').getroot().find('m:version', n).text)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pom version v${version}"; exit 1
          fi
          case "${version}" in *SNAPSHOT*) echo "::error::SNAPSHOT versions are not released"; exit 1 ;; esac
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not reachable from origin/main"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "- version: ${version}, tag: ${GITHUB_REF_NAME}, commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: |
          ./mvnw -B -V -Psbom clean verify
          ./mvnw -v | head -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Require >= 1 test and 0 failures, errors and skips
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, sys, xml.etree.ElementTree as E
          t = f = e = s = 0
          for p in glob.glob('*/target/surefire-reports/TEST-*.xml'):
              r = E.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
              e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
          print(f"- tests: {t}, failures: {f}, errors: {e}, skipped: {s}")
          if t < 1 or f or e or s:
              print("::error::the test gate needs >= 1 test and 0 failures, errors and skips", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Collect the Maven files and their SHA-256
        id: dist
        run: |
          v='${{ steps.version.outputs.version }}'
          mkdir dist
          cp pom.xml "dist/tamacat-logging-parent-${v}.pom"
          cp target/bom.json "dist/tamacat-logging-${v}-bom.json"
          cp target/bom.xml "dist/tamacat-logging-${v}-bom.xml"
          for m in core slf4j; do
            cp "tamacat-logging-${m}/pom.xml" "dist/tamacat-logging-${m}-${v}.pom"
            cp "tamacat-logging-${m}/target/tamacat-logging-${m}-${v}.jar" \
               "tamacat-logging-${m}/target/tamacat-logging-${m}-${v}-sources.jar" dist/
          done
          (cd dist && sha256sum * > SHA256SUMS)
          echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          { echo '```'; (cd dist && ls -l --time-style=+ * && cat SHA256SUMS); echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish-maven:
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-dist
          path: dist

      - name: Check the files are the tested ones
        run: |
          [ "$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" = '${{ needs.verify.outputs.dist-sha256 }}' ] \
            || { echo "::error::SHA256SUMS differs from the one verify produced"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Clone mvn-repo (anonymous; the repository is public)
        run: git clone --depth 1 --branch mvn-repo --single-branch https://github.com/tamacat/tamacat.github.io.git "$RUNNER_TEMP/mvn-repo"

      - name: Deploy, check the write scope, commit and push (up to 3 attempts)
        env:
          V: ${{ needs.verify.outputs.version }}
          PAT: ${{ secrets.MVN_REPO_PAT }}
        run: |
          repo="$RUNNER_TEMP/mvn-repo"
          base='org/tamacat/tamacat-logging-(parent|core|slf4j)'
          vre=$(printf '%s' "$V" | sed 's/\./\\./g')
          auth=$(printf 'x-access-token:%s' "$PAT" | base64 -w0)
          echo "::add-mask::${auth}"
          unset PAT
          git -C "$repo" config user.name "tamacat-logging release workflow"
          git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          deploy="org.apache.maven.plugins:maven-deploy-plugin:3.2.0:deploy-file"
          for attempt in 1 2 3; do
            # Maven runs without the token.
            ./mvnw -B -q "$deploy" -Durl="file://${repo}" -DrepositoryId=mvn-repo \
              -Dfile="dist/tamacat-logging-parent-${V}.pom" -DpomFile="dist/tamacat-logging-parent-${V}.pom" \
              -Dpackaging=pom \
              -Dfiles="dist/tamacat-logging-${V}-bom.json,dist/tamacat-logging-${V}-bom.xml" \
              -Dclassifiers="cyclonedx,cyclonedx" -Dtypes="json,xml"
            for m in core slf4j; do
              ./mvnw -B -q "$deploy" -Durl="file://${repo}" -DrepositoryId=mvn-repo \
                -DpomFile="dist/tamacat-logging-${m}-${V}.pom" \
                -Dfile="dist/tamacat-logging-${m}-${V}.jar" \
                -Dsources="dist/tamacat-logging-${m}-${V}-sources.jar"
            done
            git -C "$repo" add -A
            git -C "$repo" diff --cached --no-renames --name-status > diff.txt
            if grep -q '^D' diff.txt \
               || grep -v -E "^[AM]	${base}/(${vre}/[^/]+|maven-metadata\.xml(\.(md5|sha1|sha256|sha512))?)$" diff.txt | grep -q . \
               || git -C "$repo" diff --cached -- 'org/tamacat/tamacat-logging-*/maven-metadata.xml' | grep -q '^-[[:space:]]*<version>'; then
              cat diff.txt; echo "::error::the change goes beyond tamacat-logging ${V} and its maven-metadata.xml"; exit 1
            fi
            git -C "$repo" commit -q -m "tamacat-logging ${V} (release workflow run ${GITHUB_RUN_ID})"
            if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
               GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
               git -C "$repo" push origin HEAD:mvn-repo 2> push.err; then
              { echo "- mvn-repo commit: $(git -C "$repo" rev-parse HEAD)"; echo '```'; cat diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat push.err
            if grep -q -E '(403|401|Authentication failed|Permission)' push.err || [ "$attempt" = 3 ]; then
              echo "::error::push failed"; exit 1
            fi
            sleep $((attempt * 20))
            git -C "$repo" fetch -q --depth 1 origin mvn-repo
            git -C "$repo" reset -q --hard FETCH_HEAD
          done

  github-release:
    needs: [verify, publish-maven]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-dist
          path: dist

      - name: Create the GitHub Release with the tested files
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          [ "$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" = '${{ needs.verify.outputs.dist-sha256 }}' ] \
            || { echo "::error::SHA256SUMS differs from the one verify produced"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "tamacat-logging ${V}" --generate-notes \
            "dist/tamacat-logging-core-${V}.jar" "dist/tamacat-logging-slf4j-${V}.jar" \
            "dist/tamacat-logging-${V}-bom.json" "dist/tamacat-logging-${V}-bom.xml" dist/SHA256SUMS
